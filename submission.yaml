# ── Service contract ───────────────────────────────────────────────────────
service:
  entrypoint: "scripts/reproduce.sh"
  healthz: "GET /healthz → {status: ok}"
  triage: "POST /triage"
  metrics: "GET /metrics (Prometheus)"
  schema_in: "data/input.schema.json"
  schema_out: "data/schema.json"

# ── Key design decisions ───────────────────────────────────────────────────
decisions:
  - "No LLM in hot path: zero $0 per-inference API cost"
  - "SetFit avoids full fine-tune: 5-shot contrastive training on MiniLM"
  - "Policy boost = 1.0 (not hard mask): preserves recall on 9% off-policy gold labels"
  - "Isotonic calibration on held-out slice: confidence is genuinely useful (top70 accuracy +11pp)"
  - "Noisy fallback: last non-empty customer turn + full-context embedding for empty-final-turn rows"
  - "Noise augmentation was tried and abandoned: degraded both clean and noisy accuracy simultaneously"
