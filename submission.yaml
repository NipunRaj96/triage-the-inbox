# ── Model architecture ─────────────────────────────────────────────────────
approach:
  intent_classifier:
    type: "SetFit (sentence-transformers fine-tuned)"
    backbone: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
    parameters: "118M"
    training_data: "train.jsonl.gz (20,000 rows)"
    inference: "CPU-only, no API, no GPU"
  action_classifier:
    type: "LightGBM multiclass (30 action labels)"
    features: 552  # intent_probs (96) + history (30) + permitted (30) + embedding (384) + state (12)
    training_data: "train.jsonl.gz (20,000 rows)"
    policy_boost: 1.0
    inference: "CPU-only, < 1ms per prediction"
  calibrator:
    type: "Isotonic regression"
    trained_on: "held-out dev slice (400 rows)"
  cost_usd_per_1000: 0.00  # zero API calls, no GPU billing

